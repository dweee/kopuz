    permissions:
      contents: write
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/flakey' }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ needs.test.outputs.revision }}
