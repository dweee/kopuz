          extra-substituters = https://install.determinate.systems https://cache.lix.systems https://nix-community.cachix.org https://cache.nixos.org/ https://ai.cachix.org https://cache.numtide.com https://codex-desktop-linux.cachix.org https://nix-on-droid.cachix.org https://virby-nix-darwin.cachix.org https://cache.nixos-cuda.org https://cache.flox.dev
          extra-trusted-public-keys = cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.nixos.org-1:CNHJZBh9K4tP3EKF6FkkgeVYsS3ohTl+oS0Qa8bezVs= cache.lix.systems:aBnZUw8zA7H35Cz2RyKFVs3H4PlGTLawyY5KRbvJR8o= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= ai.cachix.org-1:N9dzRK+alWwoKXQlnn0H6aUx0lU/mspIoz8hMvGvbbc= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= codex-desktop-linux.cachix.org-1:nX/xy6AdK9hQE24A8ALGjkCKj2ObFmcnemiL5Cid4nk= nix-on-droid.cachix.org-1:56snoMJTXmDRC1Ei24CmKoUqvHJ9XCp+nidK7qkMQrU= lantian:WVGO7vsRMSEN+h7Lp7kv6SAmrkEXgUGbbXm7jMDjBuQ= virby-nix-darwin.cachix.org-1:z9GiEZeBU5bEeoDQjyfHPMGPBaIQJOOvYOOjGMKIlLo= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M= flox-cache-public-1:7F4OyH7ZCnFhcze3fJdfyXYLQw/aV7GEed86nQ7IsOs= niks3.monke.fail-1:q13GqiZgAxx7SyoLZInXoJjviZMOdNpfG03xs0VUD2M=
          connect-timeout = 20
    - name: Check Determinate Nix and daemon
      if: ${{ !(runner.os == 'macOS' && runner.arch == 'X64') }}
      run: |-
        nix --version | grep -F 'Determinate Nix 3.24.1'
        nix store info --store daemon --json
    - name: Atomically publish immutable release tag and channel
      env:
        CHANNEL_TOKEN: ${{ secrets.CHANNEL_TOKEN || github.token }}
        RELEASE_PROOFS: '{"x86_64-linux": "${{ needs.build_x86_64_linux.outputs.proof }}", "aarch64-linux": "${{
          needs.build_aarch64_linux.outputs.proof }}", "aarch64-darwin": "${{ needs.build_aarch64_darwin.outputs.proof
          }}"}'
        RELEASE_RETENTION: '{"x86_64-linux": "${{ needs.build_x86_64_linux.outputs.retention }}", "aarch64-linux":
