title = "Kopuz secret detection"

[extend]
useDefault = true

[[allowlists]]
description = "Public Nix signing keys, never upload credentials"
regexTarget = "secret"
regexes = [
  '''^(?:flakey:)?mDx4DiNpH5w1Pl8OAKFFWq1ZsypA9lbaFKNiRWhqYE8=?$''',
  '''^(?:niks3\.monke\.fail-1:)?q13GqiZgAxx7SyoLZInXoJjviZMOdNpfG03xs0VUD2M=?$'''
]
