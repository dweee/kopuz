name: Sync and test upstream
'on':
  schedule:
  - cron: "23 */6 * * *"
  workflow_dispatch: null
  repository_dispatch:
    types:
    - upstream-updated
permissions: {}
jobs:
  upstream:
    if: ${{ vars.GUARDED_UPSTREAM_SYNC_ENABLED == 'true' }}
    permissions:
      statuses: write
      id-token: write
      contents: write
      actions: write
      checks: read
    uses: dweee/dave-fork-ci/.github/workflows/upstream-sync.yml@7f7b0ab6bb4f3a8d44d45f3f42b4ce48f8c530ea
    with:
      tool-repository: dweee/dave-fork-ci
      tool-revision: 7f7b0ab6bb4f3a8d44d45f3f42b4ce48f8c530ea
      auto-merge: ${{ vars.FORK_CI_AUTO_MERGE == 'true' && vars.NIKS3_PUSH_ENABLED == 'true' }}
      cache: false
