        ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN || secrets.FLAKEY_ATTIC_TOKEN }}
      run: python3 ci/release-channel.py build --system aarch64-darwin
    - name: Remove cache reader
      if: ${{ always() }}
      run: python3 ci/configure-attic-read.py --cleanup
  retain_aarch64_darwin:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/flakey'
      }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        submodules: false
        persist-credentials: false
    - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c
      with:
