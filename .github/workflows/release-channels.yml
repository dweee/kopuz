          }}"}'
        REVISION: ${{ needs.test.outputs.revision }}
        CHANNEL: ${{ inputs.channel || 'tested' }}
      run: python3 ci/release-channel.py promote --channel "$CHANNEL" --revision "$REVISION" --proofs "$RELEASE_PROOFS"
        --retention "$RELEASE_RETENTION"
