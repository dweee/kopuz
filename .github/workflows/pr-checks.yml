# Generated by dave-fork-ci/ci/install-channel-automation.py
name: PR automation checks
'on':
  pull_request: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      revision: ${{ steps.selection.outputs.revision }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        submodules: false
        persist-credentials: false
    - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3
      if: ${{ !(runner.os == 'macOS' && runner.arch == 'X64') }}
      with:
        source-tag: v3.24.1
        summarize: false
        kvm: false
        extra-conf: |
          experimental-features = nix-command flakes parallel-eval
          eval-cores = 2
          accept-flake-config = false
          max-jobs = 1
          cores = 1
    - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c
      if: ${{ runner.os == 'macOS' && runner.arch == 'X64' }}
      with:
        nix_version: 2.34.7
        enable_kvm: false
        nix_conf: |
          experimental-features = nix-command flakes
          accept-flake-config = false
          max-jobs = 1
          cores = 1
    - name: Check Determinate Nix and daemon
      if: ${{ !(runner.os == 'macOS' && runner.arch == 'X64') }}
      run: |-
        nix --version | grep -F 'Determinate Nix 3.24.1'
        nix store info --store daemon --json
    - name: Regression tests and complete inventory policy
      run: |-
        python3 ci/test-release-channel.py
        python3 ci/test-update-automation.py
        python3 ci/release-channel.py policy
    - name: Select immutable revision
      id: selection
      env:
        REVISION: ${{ github.sha }}
      run: python3 -c 'import os,re; s=os.environ["REVISION"]; assert re.fullmatch("[a-f0-9]{40}",s); open(os.environ["GITHUB_OUTPUT"],"a").write("revision="+s+"\n")'
