    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      revision: ${{ steps.selection.outputs.revision }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        submodules: false
        persist-credentials: false
