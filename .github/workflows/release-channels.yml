# Generated by dave-fork-ci/ci/install-channel-automation.py
name: Verified release channels
'on':
  push:
    branches:
    - flakey
  pull_request: {}
  schedule:
  - cron: 43 3 * * *
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options:
        - tested
        - stable
        default: tested
      revision:
        type: string
        description: Exact tested commit for stable; empty uses the event commit
        required: false
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('verified-release-pr-{0}', github.ref) || 'verified-release-channels' }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      revision: ${{ steps.selection.outputs.revision }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        submodules: false
        persist-credentials: false
    - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c
      with:
        nix_version: 2.34.7
        enable_kvm: false
        nix_conf: |
          experimental-features = nix-command flakes
          accept-flake-config = false
          max-jobs = 1
          cores = 1
    - name: Regression tests and complete inventory policy
      run: |-
        python3 ci/test-release-channel.py
        python3 ci/test-update-automation.py
        python3 ci/release-channel.py policy
    - name: Select immutable revision
      id: selection
      env:
        REVISION: ${{ inputs.revision || github.sha }}
        CHANNEL: ${{ inputs.channel || 'tested' }}
      run: python3 -c 'import os,re; s=os.environ["REVISION"]; assert re.fullmatch("[a-f0-9]{40}",s); open(os.environ["GITHUB_OUTPUT"],"a").write("revision="+s+"\n")'
  build_x86_64_linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    needs:
    - test
    outputs:
      proof: ${{ steps.release.outputs.proof }}
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/flakey' }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ needs.test.outputs.revision }}
        fetch-depth: 0
        submodules: false
        persist-credentials: false
    - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c
      with:
        nix_version: 2.34.7
        enable_kvm: false
        nix_conf: |
          experimental-features = nix-command flakes
          accept-flake-config = false
          max-jobs = 1
          cores = 1
    - name: Configure job-local private cache reader
      env:
        ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN || secrets.FLAKEY_ATTIC_TOKEN }}
      run: python3 ci/configure-attic-read.py
    - name: Build complete native inventory, upload, verify remote NAR bytes
      id: release
      env:
        ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN || secrets.FLAKEY_ATTIC_TOKEN }}
      run: python3 ci/release-channel.py build --system x86_64-linux
    - name: Remove cache reader
      if: ${{ always() }}
      run: python3 ci/configure-attic-read.py --cleanup
  retain_x86_64_linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/flakey'
      }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        submodules: false
        persist-credentials: false
    - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c
      with:
        nix_version: 2.34.7
        enable_kvm: false
        nix_conf: |
          experimental-features = nix-command flakes
          accept-flake-config = false
          max-jobs = 1
          cores = 1
    - name: Configure job-local private reader
      env:
        ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN || secrets.FLAKEY_ATTIC_TOKEN }}
      run: python3 ci/configure-attic-read.py
    - name: Verify advertised/recent releases independently of current builds
      env:
        SOURCE_TOKEN: ${{ github.token }}
      run: python3 ci/release-channel.py retain --system x86_64-linux
    - name: Remove private reader
      if: ${{ always() }}
      run: python3 ci/configure-attic-read.py --cleanup
  build_aarch64_linux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    needs:
    - test
    outputs:
      proof: ${{ steps.release.outputs.proof }}
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/flakey' }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ needs.test.outputs.revision }}
        fetch-depth: 0
        submodules: false
        persist-credentials: false
    - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c
      with:
        nix_version: 2.34.7
        enable_kvm: false
        nix_conf: |
          experimental-features = nix-command flakes
          accept-flake-config = false
          max-jobs = 1
          cores = 1
    - name: Configure job-local private cache reader
      env:
        ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN || secrets.FLAKEY_ATTIC_TOKEN }}
      run: python3 ci/configure-attic-read.py
    - name: Build complete native inventory, upload, verify remote NAR bytes
      id: release
      env:
        ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN || secrets.FLAKEY_ATTIC_TOKEN }}
      run: python3 ci/release-channel.py build --system aarch64-linux
    - name: Remove cache reader
      if: ${{ always() }}
      run: python3 ci/configure-attic-read.py --cleanup
  retain_aarch64_linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/flakey'
      }}
