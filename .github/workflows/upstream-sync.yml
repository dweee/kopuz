name: Sync and test upstream
'on':
  schedule:
  - cron: "23 */6 * * *"
  workflow_dispatch: null
  repository_dispatch:
    types:
    - upstream-updated
permissions: {}
jobs:
  upstream:
    if: ${{ vars.GUARDED_UPSTREAM_SYNC_ENABLED == 'true' }}
    permissions:
      statuses: write
      id-token: write
      contents: write
      pull-requests: write
      actions: write
      checks: read
    uses: dweee/dave-fork-ci/.github/workflows/upstream-sync.yml@a9f1312886b2bbacfa9b2800dd36ace755665faf
    with:
      tool-repository: dweee/dave-fork-ci
      tool-revision: a9f1312886b2bbacfa9b2800dd36ace755665faf
      auto-merge: ${{ vars.FORK_CI_AUTO_MERGE == 'true' && vars.NIKS3_PUSH_ENABLED == 'true' }}
      cache: false
